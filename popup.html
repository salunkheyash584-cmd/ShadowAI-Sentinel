<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="popup.css"><title>ShadowAI Sentinel</title></head><body><main class="popup">
  <header><div class="brand"><div class="brand-mark">◈</div><div>SHADOWAI <span>SENTINEL</span><small>LOCAL PROMPT PROTECTION</small></div></div><span class="badge"><i class="dot"></i><span id="state">ACTIVE</span></span></header>
  <section class="hero"><div class="eyebrow mono">SHADOW AI DEFENSE</div><h1>Your prompts,<br><em>under your control.</em></h1><p>Scan sensitive data before it leaves this browser.</p><label class="switch-row"><span><b>Protection</b><small>On-device scanning on AI sites</small></span><input type="checkbox" id="enabled"><i></i></label></section>
  <section class="stats"><div><strong id="blocked">0</strong><span>BLOCKED</span></div><div><strong id="redacted">0</strong><span>REDACTED</span></div><div><strong id="scanned">0</strong><span>CHECKS</span></div></section>
  <section class="site-card"><div class="site-top"><b id="siteName">Current tab</b><span id="siteStatus" class="muted">Open a supported AI site</span></div><p id="siteDetail">ShadowAI Sentinel detects prompt boxes on supported services.</p></section>
  <footer><button class="btn primary" id="dashboard">Open dashboard</button><button class="btn" id="settings">Settings</button></footer>
</main><script src="popup.js"></script></body></html>
